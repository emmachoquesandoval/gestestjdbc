<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de estudiantes</title>
    <style>
        body{
            background: purple;
        }
        h1{
            color: white;
            text-align: center;
        }
        h2{
            color: white;
        }

    </style>
</head>
<body>
<h1>Gestion de estudiantes</h1>
<form action="controlador" method="get">
    <input type="text" id="select" name="select" value="SELECT * FROM alumnos" size="50"><br>
    <button type="submit">Consultar alumnos</button>
</form>
<hr>
<form action="controlador" method="post">
    <h2><label for="id">ID alumno: </label><br></h2>
    <input type="number" id="id" name="id" min="0"><br>
    <h2><label for="curso">Curso: </label><br></h2>
    <input type="text" id="curso" name="curso"><br>
    <h2><label for="nombre">Nombre: </label><br></h2>
    <input type="text" id="nombre" name="nombre"><br><br>
    <button type="submit" name="accion" value="alta">Alta</button>
</form>
</body>
</html>
